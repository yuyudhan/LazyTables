# FilePath: Cargo.toml

[package]
name = "lazytables"
version = "0.2.3"
edition = "2021"
authors = ["LazyTables Team"]
license = "MIT"
description = "Terminal-based SQL database viewer and editor with vim-style navigation"
repository = "https://github.com/yuyudhan/LazyTables"
homepage = "https://github.com/yuyudhan/LazyTables"
documentation = "https://github.com/yuyudhan/LazyTables/tree/main/docs"
readme = "README.md"
keywords = ["database", "sql", "tui", "terminal", "vim"]
categories = ["command-line-utilities", "database"]
exclude = ["/.github", "/scripts", "/docker", "/docs", "/.gitignore"]

[[bin]]
name = "lazytables"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Error handling
color-eyre = "0.6"
thiserror = "2.0"
anyhow = "1.0"

# Database drivers
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "postgres",
  "mysql",
  "sqlite",
  "chrono",
  "uuid",
] }
async-trait = "0.1"

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Security - credential storage and encryption
keyring = { version = "3.6", optional = true }
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
zeroize = "1.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1.5"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID support
uuid = { version = "1.11", features = ["v4", "serde"] }

# Directory management
dirs = "5.0"

# Clipboard support
arboard = "3.4"

# Command line argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Syntax highlighting
syntect = "5.2"

[dev-dependencies]
tempfile = "3.14"
pretty_assertions = "1.4"

[features]
default = ["secure-storage"]
secure-storage = ["keyring"]
# Future feature flags for additional databases
mysql = []
sqlite = []
redis = []

[lints.clippy]
# Enable stricter lint groups
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Allow common exceptions that are too noisy for TUI code
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
doc_markdown = "allow"
wildcard_imports = "allow"
redundant_closure_for_method_calls = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
# Pedantic lints that add noise in TUI/handler code
unnested_or_patterns = "allow"
match_same_arms = "allow"
uninlined_format_args = "allow"
missing_const_for_fn = "allow"
struct_field_names = "allow"
redundant_else = "allow"
match_wildcard_for_single_variants = "allow"
items_after_statements = "allow"
single_match_else = "allow"
manual_let_else = "allow"
if_not_else = "allow"
derive_partial_eq_without_eq = "allow"
redundant_clone = "allow"
map_unwrap_or = "allow"
or_fun_call = "allow"
str_to_string = "allow"
string_add_is_not_empty = "allow"
manual_string_new = "allow"
single_char_pattern = "allow"
implicit_clone = "allow"
match_bool = "allow"
bool_to_int_with_if = "allow"
cloned_instead_of_copied = "allow"
use_self = "allow"
trivially_copy_pass_by_ref = "allow"
fn_params_excessive_bools = "allow"
similar_names = "allow"
iter_without_into_iter = "allow"
unused_async = "allow"
semicolon_if_nothing_returned = "allow"
inconsistent_struct_constructor = "allow"
items_after_test_module = "allow"
needless_raw_string_hashes = "allow"
case_sensitive_file_extension_comparisons = "allow"
collection_is_never_read = "allow"
format_push_string = "allow"
if_then_some_else_none = "allow"
ref_option = "allow"
suboptimal_flops = "allow"
cognitive_complexity = "allow"
enum_glob_use = "allow"
useless_format = "allow"
no_effect_underscore_binding = "allow"
needless_lifetimes = "allow"
assigning_clones = "allow"
match_unit_value = "allow"
to_string_trait_impl = "allow"
branches_sharing_code = "allow"
needless_borrowed_reference = "allow"
unnecessary_lazy_evaluations = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
match_ref_pats = "allow"
manual_is_variant_and = "allow"
iter_on_single_items = "allow"
unnecessary_to_owned = "allow"
unnecessary_literal_bound = "allow"
ignored_unit_patterns = "allow"
non_std_lazy_statics = "allow"
needless_pass_by_ref_mut = "allow"
inefficient_to_string = "allow"
needless_collect = "allow"
comparison_chain = "allow"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }{ binary-ext }"
pkg-fmt = "tgz"

